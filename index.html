<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мой магазин</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Мой магазин</h1>
    <div class="cart">
      <input id="customer-name" placeholder="Ваше имя">
      <span>Корзина: <span id="cart-count">0</span> шт. на <span id="cart-sum">0</span> ₽</span>
      <button id="checkout">Оформить заказ</button>
    </div>
  </header>
  <main>
    <div id="catalog" class="catalog"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
