<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Админка магазина</title>
  <link rel="stylesheet" href="style.css">
  <style>
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { padding: 8px 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
    td input { width: 100px; padding: 4px 6px; }
    .add-form { background: #fff; padding: 16px; border-radius: 10px; margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
    .add-form input, .add-form select { padding: 8px; }
    .danger { background: #dc2626; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
    .save { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 6px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <header>
    <h1>Админка</h1>
    <a href="index.html" style="color:#fff">← В магазин</a>
  </header>
  <main>
    <p id="denied" hidden>Доступ только для администратора. Войдите на главной странице под учётной записью администратора.</p>
    <div id="panel" hidden>
      <form class="add-form" id="add-form">
        <input name="title" placeholder="Название" required>
        <input name="price" type="number" step="0.01" min="0" placeholder="Цена" required>
        <input name="stock" type="number" min="0" placeholder="Остаток" required>
        <select name="category_id" id="category-select"></select>
        <button type="submit" class="save">Добавить товар</button>
      </form>
      <table>
        <thead><tr><th>ID</th><th>Название</th><th>Категория</th><th>Цена</th><th>Остаток</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script src="admin.js"></script>
</body>
</html>
